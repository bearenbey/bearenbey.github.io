<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>iSwitch · Game Log</title>
  <meta name="description" content="My Nintendo game log: what I'm playing, my backlog, scores, reviews and stats.">
  <meta name="theme-color" content="#e60012">
  <link rel="canonical" href="https://bearenbey.github.io/">

  <!-- Link previews (Discord, iMessage, X, …) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="iSwitch">
  <meta property="og:title" content="iSwitch · Game Log">
  <meta property="og:description" content="My Nintendo game log: what I'm playing, my backlog, scores, reviews and stats.">
  <meta property="og:url" content="https://bearenbey.github.io/">
  <meta property="og:image" content="https://bearenbey.github.io/img/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="iSwitch, my Nintendo game log">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Installable app (Add to Home Screen) -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="iSwitch">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='8' width='22' height='48' rx='11' fill='%23e60012'/%3E%3Crect x='38' y='8' width='22' height='48' rx='11' fill='%2300b8e6'/%3E%3Ccircle cx='15' cy='22' r='5' fill='%23fff'/%3E%3Ccircle cx='49' cy='40' r='5' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Apply saved theme before paint to avoid a flash.
    try {
      const s = JSON.parse(localStorage.getItem('iswitch.v1') || '{}');
      const t = localStorage.getItem('iswitch.theme') || (s.settings && s.settings.theme);
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <button class="avatar" data-action="go" data-route="data" aria-label="Profile and data settings">
      <span id="avatarInitial">P</span>
    </button>
    <a class="brand" href="#home" aria-label="iSwitch home">
      <span class="brand-mark" aria-hidden="true"><i></i><i></i></span>
      <span class="brand-name">iSwitch</span>
    </a>
    <div class="topbar-right">
      <a class="pub-badge owner-only" id="pubBadge" href="#data" hidden></a>
      <button class="icon-btn" data-action="theme" aria-label="Toggle light / dark theme" title="Basic White / Basic Black">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
      </button>
      <span class="clock" id="clock">--:--</span>
      <span class="battery" id="battery" data-tip="Completion rate">
        <span class="battery-body"><span class="battery-fill" id="batteryFill"></span></span>
        <span class="battery-pct" id="batteryPct">0%</span>
      </span>
    </div>
  </header>

  <main id="view" class="view" tabindex="-1"></main>

  <nav class="dock" aria-label="Main">
    <a href="#home" class="dock-btn" data-route="home" style="--c: var(--red)">
      <span class="dock-circle"><svg viewBox="0 0 24 24"><path d="M3 11 12 3l9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></span>
      <span class="dock-label">Home</span>
    </a>
    <a href="#library" class="dock-btn" data-route="library" style="--c: #00a0e9">
      <span class="dock-circle"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg></span>
      <span class="dock-label">Library</span>
    </a>
    <button class="dock-btn dock-add owner-only" data-action="new-game" style="--c: var(--red)">
      <span class="dock-circle"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke-width="3" stroke-linecap="round" fill="none" stroke="currentColor"/></svg></span>
      <span class="dock-label">Add game</span>
    </button>
    <a href="#backlog" class="dock-btn" data-route="backlog" style="--c: #f39800">
      <span class="dock-circle"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="4" rx="2"/><rect x="3" y="10" width="18" height="4" rx="2"/><rect x="3" y="16" width="18" height="4" rx="2"/></svg></span>
      <span class="dock-label">Backlog</span>
    </a>
    <a href="#stats" class="dock-btn" data-route="stats" style="--c: #22ac38">
      <span class="dock-circle"><svg viewBox="0 0 24 24"><rect x="3" y="12" width="4" height="9" rx="2"/><rect x="10" y="7" width="4" height="14" rx="2"/><rect x="17" y="3" width="4" height="18" rx="2"/></svg></span>
      <span class="dock-label">Stats</span>
    </a>
    <a href="#data" class="dock-btn owner-only" data-route="data" style="--c: #8c8c8c">
      <span class="dock-circle"><svg viewBox="0 0 24 24"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zm8.6 5-1.7-.9a7 7 0 0 0 0-1.2l1.7-.9a.6.6 0 0 0 .2-.8l-1.7-3a.6.6 0 0 0-.8-.2l-1.7.9a7 7 0 0 0-1-.6V3.6a.6.6 0 0 0-.6-.6h-3.4a.6.6 0 0 0-.6.6v1.9a7 7 0 0 0-1 .6l-1.7-.9a.6.6 0 0 0-.8.2l-1.7 3a.6.6 0 0 0 .2.8l1.7.9a7 7 0 0 0 0 1.2l-1.7.9a.6.6 0 0 0-.2.8l1.7 3a.6.6 0 0 0 .8.2l1.7-.9a7 7 0 0 0 1 .6v1.9c0 .3.3.6.6.6h3.4c.3 0 .6-.3.6-.6v-1.9a7 7 0 0 0 1-.6l1.7.9c.3.2.6 0 .8-.2l1.7-3a.6.6 0 0 0-.2-.8z"/></svg></span>
      <span class="dock-label">Settings</span>
    </a>
  </nav>

  <dialog id="gameDialog" class="sheet" aria-labelledby="dlgTitle"></dialog>
  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input type="file" id="importFile" accept="application/json,.json" hidden>

  <script src="js/app.js"></script>
</body>
</html>
